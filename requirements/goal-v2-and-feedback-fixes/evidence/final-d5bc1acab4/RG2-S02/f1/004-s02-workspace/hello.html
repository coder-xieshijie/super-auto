<!DOCTYPE html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hello Goal</title>
    <style>
      :root {
        color-scheme: light dark;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #f6f7fb;
        color: #16181d;
      }

      main {
        text-align: center;
        padding: 2rem;
      }

      h1 {
        margin: 0 0 0.5rem;
        font-size: clamp(2rem, 8vw, 3.5rem);
        letter-spacing: -0.02em;
      }

      p {
        margin: 0;
        color: #5b6472;
        font-size: 1rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Hello Goal</h1>
      <p>A small web page created in the workspace.</p>

</html>
